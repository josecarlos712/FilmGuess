<!doctype html>
<html lang="es" data-type="software" data-radius="soft">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="gaming" />
    <meta name="theme-color" content="#111111" />
    <title>Adivina la Peli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&family=Figtree:wght@400..600&family=Martian+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/system.css" />
    <link rel="stylesheet" href="/static/cover.css" />
    <link rel="stylesheet" href="/static/tv/tv.css" />
  </head>
  <body>
    <!-- Pantalla de la tele: se transmite tal cual. El único control es el acceso a los packs. -->
    <main class="tv">
      <div class="ambient" aria-hidden="true">
        <div class="ambient-glow"></div>
        <div class="ambient-glow two"></div>
        <div class="fgc-grain"></div>
      </div>

      <section id="espera" class="screen waiting" aria-labelledby="logo">
        <div class="brand">
          <h1 id="logo" class="logo" data-enter>
            <span class="logo-line"><span class="logo-word" data-text="logo1"></span></span>
            <span class="logo-line"><span class="logo-word logo-accent" data-text="logo2"></span></span>
          </h1>
          <div class="join" data-enter="2">
            <div class="qr">
              <span class="qr-scan" aria-hidden="true"></span>
              <img id="qr" src="/pairing/qr.svg" alt="" width="240" height="240" />
            </div>
            <div class="join-text">
              <p class="join-title" data-text="unirse"></p>
              <p class="join-hint muted" data-text="unirseAyuda"></p>
              <p id="direccion" class="join-addr num"></p>
              <!-- Se abre en otra pestaña: esta la maneja el juego para mostrar Netflix. -->
              <a class="btn secondary packs-link" href="/editor-packs/" target="_blank" rel="noopener" data-text="editarPacks"></a>
            </div>
          </div>
        </div>

        <aside class="board card" aria-labelledby="titulo-marcador" data-enter="3">
          <h2 id="titulo-marcador" class="board-title" data-text="marcador"></h2>
          <ol id="jugadores" class="players"></ol>
          <p id="sin-jugadores" class="board-empty muted" data-text="sinJugadores"></p>
        </aside>

        <p id="aviso" class="notice hidden" role="status"></p>
      </section>

      <!-- Mismo marcado que la cubierta de Netflix (web/cover.css y netflix_api.js). -->
      <section id="cargando" class="fg-cover hidden" aria-live="polite">
        <div class="fgc-glow"></div>
        <div class="fgc-beam"></div>
        <div class="fgc-finder" aria-hidden="true">
          <div class="fgc-corners"></div>
          <div class="fgc-rec"></div>
          <div class="fgc-leader"><div class="fgc-sweep"></div><div class="fgc-dot"></div></div>
        </div>
        <p class="fgc-label" data-text="cargando"></p>
        <div class="fgc-strip" aria-hidden="true"><div class="fgc-reel"></div><div class="fgc-gate"></div></div>
        <div class="fgc-vignette"></div>
        <div class="fgc-grain"></div>
      </section>

      <p id="conexion" class="connection hidden" role="status" data-text="reconectando"></p>
    </main>

    <script type="module" src="/static/tv/tv.js"></script>
  </body>
</html>
